
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AG Football</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071b13;color:white;font-family:Arial;text-align:center;padding:18px}
h1{color:#63f5b0}
#field{position:relative;width:100%;max-width:420px;height:400px;margin:20px auto;background:repeating-linear-gradient(0deg,#168447 0 50px,#10763c 50px 100px);border:4px solid white;border-radius:8px;overflow:hidden}
#field:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid white}
#goal{position:absolute;top:8px;left:30%;width:40%;height:45px;border:3px solid white;border-top:0}
#ball{position:absolute;bottom:45px;left:calc(50% - 18px);font-size:36px;transition:left .12s,bottom .12s}
#keeper{position:absolute;top:60px;left:calc(50% - 22px);font-size:38px;transition:left .15s}
button{border:0;border-radius:12px;padding:14px 20px;margin:5px;background:#54efad;color:#062418;font-size:17px;font-weight:bold}
#msg{min-height:28px;font-weight:bold}
</style>
</head>
<body>
<h1>⚽ AG FOOTBALL</h1>
<p>Arahkan bola dan cetak gol!</p>
<div>Skor: <b id="score">0</b> | Tembakan: <b id="shots">0</b></div>
<div id="field">
<div id="goal"></div>
<div id="keeper">🧤</div>
<div id="ball">⚽</div>
</div>
<div id="msg">Pilih arah tembakan!</div>
<div>
<button onclick="shoot(-1)">↖ Kiri</button>
<button onclick="shoot(0)">⬆ Tengah</button>
<button onclick="shoot(1)">↗ Kanan</button>
</div>
<button onclick="resetGame()">🔄 Ulangi</button>
<script>
let score=0,shots=0,busy=false;
function shoot(dir){
 if(busy)return;
 busy=true;shots++;
 const ball=document.getElementById('ball');
 const keeper=document.getElementById('keeper');
 const msg=document.getElementById('msg');
 const target=50+dir*30;
 const save=Math.random()<0.38;
 const keeperPos=save?target:(Math.random()*60-30+50);
 ball.style.left='calc('+target+'% - 18px)';
 ball.style.bottom='300px';
 keeper.style.left='calc('+keeperPos+'% - 22px)';
 setTimeout(()=>{
  if(Math.abs(target-keeperPos)<19){
   msg.textContent='🧤 DITANGKAP KIPER!';
  }else{
   score++;msg.textContent='🥅 GOOOL! Keren, Bray!';
  }
  document.getElementById('score').textContent=score;
  document.getElementById('shots').textContent=shots;
  setTimeout(()=>{
   ball.style.left='calc(50% - 18px)';
   ball.style.bottom='45px';
   keeper.style.left='calc(50% - 22px)';
   busy=false;
  },650);
 },250);
}
function resetGame(){
 score=0;shots=0;busy=false;
 document.getElementById('score').textContent=0;
 document.getElementById('shots').textContent=0;
 document.getElementById('msg').textContent='Pilih arah tembakan!';
 document.getElementById('ball').style.cssText='';
 document.getElementById('keeper').style.cssText='';
}
</script>
</body>
</html>
